<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Fishの小角角</title>
    <link rel="stylesheet" href="HomeIndexStyle.css">
    <style>
        /* ===== 背景壁纸层 ===== */
        .bg-wallpaper {
            position: fixed;          /* 固定定位，不随滚动 */
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;               /* 放在所有内容下面 */
            background-image: url('img/img1.png');
            background-size: cover;   /* 铺满屏幕，可改为 contain 或具体尺寸 */
            background-position: center;
            background-repeat: no-repeat;

            /* 关键：上下渐变透明（让壁纸与背景色融合） */
            mask-image: linear-gradient(to bottom,
            rgba(0, 0, 0, 1) 0%,
            rgba(0, 0, 0, 0.8) 20%,
            rgba(0, 0, 0, 0) 100%
            );
            -webkit-mask-image: linear-gradient(to bottom,
            rgba(0, 0, 0, 1) 0%,
            rgba(0, 0, 0, 0.8) 20%,
            rgba(0, 0, 0, 0) 100%
            );
        }

        /* 确保所有内容在壁纸之上 */
        body {
            position: relative;
            z-index: 1;
        }

        /* 如果你希望壁纸尺寸固定为 216x468 并居中，可以改成： */
        /*
        .bg-wallpaper {
            background-size: 216px 468px;
            background-position: center;
            background-repeat: no-repeat;
        }
        */
    </style>
</head>
<body>

<!-- 头像 -->
<div style="display: flex; flex-direction: column; align-items: center;">
    <a href="posts" id="avatar" class="card-link">
        <img src="icon.png" alt="avatar">
    </a>
    <a href="links" id="name">@符笙</a>
</div>
<div class="wallpaper-wrapper">
    <img class="wallpaper-img" src="img/img1.png" alt="壁纸">
</div>
<!-- 卡片堆叠 -->
<div class="card-stack">
<!--    <div class="card card-desc">首页会显示所有帖子列表（后续可自动生成）</div>-->

    <div class="card card-divider"><hr></div>

    <!-- 文章列表链接卡片 -->
    <a href="posts" class="card" style="padding-bottom: 16px;text-decoration: none">
        <div class="main-title">📚 所有文章</div>
    </a>
    <a href="programs.html" class="card" style="padding-bottom: 16px;text-decoration: none">
        <div class="main-title">我的项目</div>
    </a>

    <div class="card card-divider"><hr></div>
    <a href="admin.html" class="card-link">📤 去发帖</a>
</div>

</body>
</html>
