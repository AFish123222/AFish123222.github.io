<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Fishの小角角</title>
    <link rel="stylesheet" href="HomeIndexStyle.css">
    <style>
        /* 壁纸容器：居中，无背景，无边框 */
        .wallpaper-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;          /* 去掉内边距 */
            margin: 0 auto;
            background: none;    /* 完全透明 */
            border: none;
            box-shadow: none;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }

        /* 图片本身：应用上下渐变透明遮罩 */
        .wallpaper-img {
            width: 216px;        /* 保持你设定的尺寸 */
            height: 468px;
            display: block;
            object-fit: cover;
            /* 核心：从上到下渐变透明，顶部不透明，底部完全透明 */
            mask-image: linear-gradient(to bottom,
            rgba(0, 0, 0, 1) 0%,      /* 顶部完全不透明 */
            rgba(0, 0, 0, 0.8) 20%,   /* 稍微过渡 */
            rgba(0, 0, 0, 0) 100%     /* 底部完全透明 */
            );
            -webkit-mask-image: linear-gradient(to bottom,
            rgba(0, 0, 0, 1) 0%,
            rgba(0, 0, 0, 0.8) 20%,
            rgba(0, 0, 0, 0) 100%
            );
            /* 如果希望上下都渐变透明，可以用两个方向叠加，但这里只做从上到下 */
        }
    </style>
</head>
<body>

<!-- 头像 -->
<div style="display: flex; flex-direction: column; align-items: center;">
    <a href="posts" id="avatar" class="card-link">
        <img src="icon.png" alt="avatar">
    </a>
    <a href="links" id="name">@符笙</a>
</div>
<div class="wallpaper-wrapper">
    <img class="wallpaper-img" src="img/img1.png" alt="壁纸">
</div>
<!-- 卡片堆叠 -->
<div class="card-stack">
<!--    <div class="card card-desc">首页会显示所有帖子列表（后续可自动生成）</div>-->

    <div class="card card-divider"><hr></div>

    <!-- 文章列表链接卡片 -->
    <a href="posts" class="card" style="padding-bottom: 16px;text-decoration: none">
        <div class="main-title">📚 所有文章</div>
    </a>
    <a href="programs.html" class="card" style="padding-bottom: 16px;text-decoration: none">
        <div class="main-title">我的项目</div>
    </a>

    <div class="card card-divider"><hr></div>
    <a href="admin.html" class="card-link">📤 去发帖</a>
</div>

</body>
</html>
