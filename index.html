<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Fish's Blog</title>
    <link rel="stylesheet" href="HomeIndexStyle.css">
</head>
<body>



<!-- 头像 -->
<div style="display: flex; flex-direction: column; align-items: center;">
    <a href="posts" id="avatar" class="card-link">
        <img src="icon.png" alt="avatar">
    </a>
    <a href="links" id="name">符笙</a>
</div>

<!-- 卡片堆叠 -->
<div class="card-stack">
    <div class="card card-desc">首页会显示所有帖子列表（后续可自动生成）</div>
    <!-- 帖子列表卡片 -->
    <div class="card" id="post-list" style="text-align: left; padding: 20px 30px;">
        <div style="font-weight: 500; margin-bottom: 12px; color: rgba(255,255,255,0.6); font-size: 0.9rem;">
            📄 最近更新
        </div>
        <div id="posts-container">
            <p style="color: rgba(255,255,255,0.4);">加载中...</p>
        </div>
    </div>
    <div class="card card-divider"><hr></div>
    <a href="admin.html" class="card-link">📤 去发帖</a>
</div>

<script>
    // 配置你的 GitHub 信息
    const OWNER = '你的用户名';            // 改成你的
    const REPO = '你的用户名.github.io';   // 改成你的仓库名
    const POSTS_DIR = 'posts';

    async function fetchPosts() {
        const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${POSTS_DIR}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('无法获取列表');
        const files = await res.json();
        // 只保留 .md 文件，按文件名倒序（最新的在前）
        return files
            .filter(f => f.name.endsWith('.md'))
            .sort((a, b) => b.name.localeCompare(a.name));
    }

    function renderPosts(posts) {
        const container = document.getElementById('posts-container');
        if (posts.length === 0) {
            container.innerHTML = '<p style="color: rgba(255,255,255,0.4);">还没有帖子 📝</p>';
            return;
        }
        container.innerHTML = posts.map(post => {
            const name = post.name.replace(/\.md$/, '');
            // 从文件名解析日期和标题（假设格式：YYYY-MM-DD-标题.md）
            const parts = name.split('-');
            let date = '未知日期', title = name;
            if (parts.length >= 4) {
                date = `${parts[0]}-${parts[1]}-${parts[2]}`;
                title = parts.slice(3).join('-');
            }
            return `
                <div class="post-item" style="
                    padding: 10px 0;
                    border-bottom: 1px solid rgba(255,255,255,0.06);
                    display: flex;
                    justify-content: space-between;
                    cursor: pointer;
                " onclick="window.location.href='posts/post.html?url=${encodeURIComponent(post.download_url)}'">
                    <span style="color: rgba(255,255,255,0.9);">${title}</span>
                    <span style="color: rgba(255,255,255,0.3); font-size: 0.8rem;">${date}</span>
                </div>
            `;
        }).join('');
    }

    // 页面加载时自动运行
    (async function init() {
        try {
            const posts = await fetchPosts();
            renderPosts(posts);
        } catch (err) {
            document.getElementById('posts-container').innerHTML =
                `<p style="color: rgba(255,255,255,0.4);">⚠️ 加载失败：${err.message}</p>`;
        }
    })();
</script>

</body>
</html>
