<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Fishの小角角</title>
    <link rel="stylesheet" href="HomeIndexStyle.css">
    <style>
        /* 在 body 上直接加载背景壁纸 */
        body {
            /* 保留原有的蓝紫渐变作为底色 */
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460, #533483);
            /* 用伪元素承载壁纸，不影响内容 */
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            /* 从 CSS 加载图片 */
            background-image: url('img/img1.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            /* 上下渐变透明（顶部不透明 → 底部完全透明） */
            mask-image: linear-gradient(to bottom, black 0%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 0%, transparent 100%);
            pointer-events: none;  /* 让点击穿透，不干扰内容 */
        }

        /* 确保所有内容在壁纸之上 */
        body > * {
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>

<!-- 头像 -->
<div style="display: flex; flex-direction: column; align-items: center;">
    <a href="posts" id="avatar" class="card-link">
        <img src="icon.png" alt="avatar">
    </a>
    <a href="links" id="name">@符笙</a>
</div>

<!-- 卡片堆叠 -->
<div class="card-stack">
<!--    <div class="card card-desc">首页会显示所有帖子列表（后续可自动生成）</div>-->

    <div class="card card-divider"><hr></div>

    <!-- 文章列表链接卡片 -->
    <a href="posts" class="card" style="padding-bottom: 16px;text-decoration: none">
        <div class="main-title">📚 所有文章</div>
    </a>
    <a href="programs.html" class="card" style="padding-bottom: 16px;text-decoration: none">
        <div class="main-title">我的项目</div>
    </a>

    <div class="card card-divider"><hr></div>
    <a href="admin.html" class="card-link">📤 去发帖</a>
</div>

</body>
</html>
