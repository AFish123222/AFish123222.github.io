<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>阅读文章</title>
  <link rel="stylesheet" href="HomeIndexStyle.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
<a href="../index.html">Home</a>
<div class="title-card">📖 阅读</div>
<div class="card-stack" style="max-width: 700px;">
  <div class="card" id="post-content" style="text-align: left; padding: 30px 35px;">
    <div id="loading" style="color: rgba(255,255,255,0.5);">加载中...</div>
  </div>
  <a href="index.html" class="card-link">← 返回首页</a>
</div>
<script>
  (async function() {
    const params = new URLSearchParams(window.location.search);
    const rawUrl = params.get('url');   // 直接从 params 取，不用重复声明

    if (!rawUrl) {
      document.getElementById('loading').textContent = '❌ 没有指定文章';
      return;
    }

    try {
      const res = await fetch(rawUrl);
      if (!res.ok) throw new Error('加载失败');
      const md = await res.text();
      document.getElementById('post-content').innerHTML = marked.parse(md);
    } catch (err) {
      document.getElementById('loading').textContent = '❌ ' + err.message;
    }
  })();
</script>
</body>
</html>
